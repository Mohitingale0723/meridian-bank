<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meridian Bank</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F6F2;--card:#fff;--ink:#12263A;--mute:#5E6E7C;--line:#DCE3DC;--jade:#0F8B6D;--jade2:#E1F3EC;--sun:#F2A33A;--red:#D8503F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A26;--card:#162636;--ink:#EAF0EE;--mute:#9CAEBB;--line:#243A4D;--jade:#2CC59C;--jade2:#12332F}}
:root[data-theme="dark"]{--bg:#0E1A26;--card:#162636;--ink:#EAF0EE;--mute:#9CAEBB;--line:#243A4D;--jade:#2CC59C;--jade2:#12332F}
:root.cb{--jade:#1B6FD1;--jade2:#DCE9F9;--red:#E07B00}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 'DM Sans',system-ui,sans-serif}
body.sr{font-size:20px}body.sr .btn,body.sr .tile{padding:18px}body.sr{--line:#12263A}
body.rm *{transition:none!important;animation:none!important}
h1,h2,h3,.disp{font-family:'Bricolage Grotesque','DM Sans',sans-serif;margin:0}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.hide{display:none!important}small,.mu{color:var(--mute)}
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.brand{background:#12263A;color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.brand h1{font-size:clamp(34px,5vw,58px);line-height:1.02;font-weight:800;max-width:11ch}
.brand p{color:#B9C8D3;max-width:34ch}.brand .ring{position:absolute;right:-120px;bottom:-120px;width:380px;height:380px;border-radius:50%;border:56px solid #0F8B6D;opacity:.55}
.logo{display:flex;align-items:center;gap:10px;font:800 20px 'Bricolage Grotesque'}.logo i{width:30px;height:30px;border-radius:9px;background:var(--sun);display:grid;place-items:center;color:#12263A;font-style:normal}
.fs{display:grid;place-items:center;padding:32px}.form{width:100%;max-width:370px}
label{display:block;font-weight:700;margin:14px 0 6px;font-size:13px}
input,select{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card)}
input[type=range]{padding:0;accent-color:var(--jade)}
.btn{background:var(--jade);color:#fff;border:0;padding:12px 18px;border-radius:12px;font-weight:700;width:100%;margin-top:14px}
.btn.alt{background:var(--jade2);color:var(--jade)}.btn.red{background:var(--red)}.btn.sm{width:auto;margin:0;padding:7px 13px}
.err{color:var(--red);font-size:13px;min-height:20px;margin-top:6px}
#bar{position:fixed;top:0;left:0;right:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) 20px 10px;display:flex;align-items:center;justify-content:space-between}
#bar .r{display:flex;gap:10px;align-items:center;position:relative}
.ib{border:0;background:var(--bg);width:40px;height:40px;border-radius:50%;font-size:18px;position:relative}
.dot{position:absolute;top:6px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--red)}
#pm{position:absolute;right:0;top:48px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;min-width:170px}
#pm button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:9px}#pm button:hover{background:var(--jade2)}
main{max-width:980px;margin:0 auto;padding:84px 20px 40px}
.av{width:44px;height:44px;border-radius:50%;background:var(--sun) center/cover;display:grid;place-items:center;font:800 16px 'Bricolage Grotesque';color:#12263A;border:0}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1.3fr 1fr}.g3{grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}.g2e{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.bal{background:#12263A;color:#fff;border:0;position:relative}.bal .amt{font:800 38px 'Bricolage Grotesque';margin:4px 0}.bal small{color:#B9C8D3}
.bal .eye{position:absolute;right:14px;top:14px;background:#ffffff22;border:0;color:#fff;border-radius:10px;padding:6px 10px}
.tile{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;transition:transform .15s,border-color .15s}
.tile:hover{border-color:var(--jade);transform:translateY(-2px)}
.ic{font-size:22px;width:42px;height:42px;border-radius:12px;background:var(--jade2);display:grid;place-items:center;flex:none}
.tile small{line-height:1.3}
.back{border:0;background:none;color:var(--jade);font-weight:700;padding:0;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.sw{position:relative;width:48px;height:26px;border-radius:99px;border:0;background:var(--line);flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}.sw.on{background:var(--jade)}.sw.on::after{left:25px}
.cr{color:var(--jade);font-weight:700}.dr{color:var(--red);font-weight:700}
.res{background:var(--jade2);border-radius:14px;padding:16px;margin-top:14px}.big{font:800 30px 'Bricolage Grotesque';color:var(--jade)}
.pb{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}.pb i{display:block;height:100%;background:var(--jade);transition:width .3s}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chips button{border:1px solid var(--line);background:var(--card);padding:7px 13px;border-radius:99px}.chips button.on{background:var(--ink);color:var(--bg)}
.chat{height:260px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:6px}
.b{max-width:80%;padding:9px 13px;border-radius:14px;background:var(--bg)}.b.me{align-self:flex-end;background:var(--jade);color:#fff}
.vc{border-radius:20px;padding:22px;color:#fff;background:linear-gradient(135deg,#0F8B6D,#12263A);aspect-ratio:1.6;max-width:350px;display:flex;flex-direction:column;justify-content:space-between}.vc.fz{filter:grayscale(1) brightness(.7)}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}.ok{background:var(--jade2);color:var(--jade)}.wr{background:#FCE6C6;color:#8A5200}.bd{background:#F9D9D4;color:var(--red)}
.call{background:#12263A;color:#fff;border-radius:18px;aspect-ratio:16/9;display:grid;place-items:center;text-align:center;font-size:18px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:60}
@media(max-width:780px){#login{grid-template-columns:1fr}.brand{padding:28px;min-height:250px}.g2,.g2e{grid-template-columns:1fr}main{padding:84px 14px 40px}}
</style></head><body>
<section id="login"><div class="brand"><div class="logo"><i>M</i>Meridian Bank</div><div><h1>Banking made simple and safe.</h1><p style="margin-top:14px">Sign in to explore the demo.</p></div><div class="ring"></div></div>
<div class="fs"><div class="form"><h2 style="font-size:28px">Welcome back</h2>
<div id="s1"><label for="cid">Customer ID</label><input id="cid" autocomplete="off" placeholder="MB10245678">
<label for="mob">Mobile number</label><input id="mob" inputmode="numeric" maxlength="10" placeholder="10-digit number">
<label for="pw">Password</label><div style="display:flex;gap:8px"><input id="pw" type="password" autocomplete="off"><button class="btn alt sm" id="eye" type="button">Show</button></div>
<div class="err" id="err"></div><button class="btn" id="go">Log in</button><button class="btn alt" id="demo" type="button">Fill demo login</button>
<p class="mu" style="font-size:13px;margin-top:12px">Demo: ID <b>MB10245678</b> · Mobile <b>9820012345</b> · Password <b>Demo@123</b><br><a href="#" id="fp" style="color:var(--jade)">Forgot password?</a></p></div>
<div id="s2" class="hide"><p class="mu">We sent a 6-digit OTP to your mobile. Demo OTP: <b>123456</b></p><label for="otp">Enter OTP</label><input id="otp" inputmode="numeric" maxlength="6"><div class="err" id="err2"></div><button class="btn" id="vo">Verify and continue</button></div></div></div></section>
<div id="app" class="hide"><header id="bar"><div class="logo"><i>M</i>Meridian</div><div class="r"><button class="ib" aria-label="Notifications" onclick="show('notif')">🔔<span class="dot"></span></button><button class="av" id="avT" aria-label="Profile menu"></button><div id="pm" class="hide"><button onclick="show('dash')">🏠 Dashboard</button><button onclick="show('access')">♿ Accessibility</button><button onclick="logout()">🚪 Log out</button></div></div></header><main id="pg"></main></div>
<div id="toast" class="hide" role="status"></div>
<script>
const $=s=>document.querySelector(s),fm=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hide'),2200)};
const S={bal:128450,show:1,photo:'',sr:0,lock:0,exp:[['Food',4200],['Travel',2800],['Bills',6100],['Shopping',3900],['Health',1200]],budget:25000,nt:{Security:1,Payments:1,Offers:1,Tips:1}};
const tx=[['Big Basket',-1840],['Salary credit',85000],['MSEB Electricity',-2310],['Swiggy',-460]];
/* login */
$('#eye').onclick=()=>{const p=$('#pw');p.type=p.type=='password'?'text':'password';$('#eye').textContent=p.type=='password'?'Show':'Hide'};
$('#demo').onclick=()=>{$('#cid').value='MB10245678';$('#mob').value='9820012345';$('#pw').value='Demo@123';go1()};
$('#fp').onclick=e=>{e.preventDefault();$('#err').textContent='Demo only: password is Demo@123'};
function go1(){const e=$('#err');if(!$('#cid').value.trim())return e.textContent='Enter your Customer ID.';if(!/^\d{10}$/.test($('#mob').value))return e.textContent='Mobile number must be exactly 10 digits.';if($('#pw').value!=='Demo@123')return e.textContent='Incorrect password. Use Demo@123.';e.textContent='';$('#s1').classList.add('hide');$('#s2').classList.remove('hide')}
$('#go').onclick=go1;
$('#vo').onclick=()=>{if($('#otp').value!=='123456')return $('#err2').textContent='Wrong OTP. Use 123456.';$('#login').classList.add('hide');$('#app').classList.remove('hide');show('dash')};
function logout(){$('#app').classList.add('hide');$('#login').classList.remove('hide');$('#s1').classList.remove('hide');$('#s2').classList.add('hide');$('#otp').value='';$('#pw').value=''}
$('#avT').onclick=()=>$('#pm').classList.toggle('hide');
/* helpers */
const T=(l,s,on=1)=>`<div class="row"><span><b>${l}</b><br><small>${s}</small></span><button class="sw ${on?'on':''}" aria-label="${l}" onclick="this.classList.toggle('on');toast('${l}: '+(this.classList.contains('on')?'On':'Off'))"></button></div>`;
const inp=(id,l,v)=>`<label for="${id}">${l}</label><input id="${id}" value="${v}" inputmode="decimal">`;
const num=id=>+$('#'+id).value||0;
const bars=d=>{const m=Math.max(...d.map(x=>x[1]));return`<svg viewBox="0 0 300 150" width="100%" role="img" aria-label="Bar chart">${d.map((x,i)=>{const h=x[1]/m*100;return`<rect x="${i*58+10}" y="${115-h}" width="40" height="${h}" rx="6" fill="var(--jade)"/><text x="${i*58+30}" y="132" text-anchor="middle" font-size="10" fill="var(--mute)">${x[0]}</text><text x="${i*58+30}" y="${110-h}" text-anchor="middle" font-size="10" fill="var(--ink)">${Math.round(x[1]/100)/10}k</text>`}).join('')}</svg>`};
const COL=['#0F8B6D','#F2A33A','#12263A','#D8503F','#7A6BD6'];
const donut=d=>{const t=d.reduce((a,x)=>a+x[1],0);let o=0;return`<svg viewBox="0 0 120 120" width="190" role="img" aria-label="Donut chart"><g transform="rotate(-90 60 60)">${d.map((x,i)=>{const l=x[1]/t*251.3;const s=`<circle cx="60" cy="60" r="40" fill="none" stroke="${COL[i]}" stroke-width="20" stroke-dasharray="${l} 251.3" stroke-dashoffset="${-o}"/>`;o+=l;return s}).join('')}</g></svg><div>${d.map((x,i)=>`<div><span style="color:${COL[i]}">●</span> ${x[0]} ${Math.round(x[1]/t*100)}%</div>`).join('')}</div>`};
/* chat logic shared by AI + voice */
function ans(q){q=q.toLowerCase();if(/balance/.test(q))return`Your balance is ${fm(S.bal)}.`;if(/transact|last|recent/.test(q))return'Recent: Big Basket −₹1,840, Salary +₹85,000, MSEB −₹2,310.';if(/save|saving/.test(q))return'You spend most on Bills. Cutting dining by 15% could save about ₹1,800 a month.';if(/card|freeze|block/.test(q))return'Open Card Control from the dashboard to freeze your card.';if(/emi|loan/.test(q))return'Your EMIs are about 28% of income. That is in the safe range.';return'I can help with balance, transactions, savings, cards and EMIs.'}
function chat(q){q=(q||$('#cq').value).trim();if(!q)return;const l=$('#cl');l.insertAdjacentHTML('beforeend',`<div class="b me">${q}</div><div class="b">${ans(q)}</div>`);l.scrollTop=1e9;$('#cq').value=''}
function say(q){q=(q||$('#vq').value).trim();if(!q)return;$('#vo2').innerHTML=`<b>You said:</b> ${q}<br><b>Meridian:</b> ${ans(q)}`;if(window.speechSynthesis&&!S.mute)try{speechSynthesis.speak(new SpeechSynthesisUtterance(ans(q)))}catch(e){}}
function mic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Voice not supported here. Type a command instead.');const r=new R();r.lang='en-IN';r.onresult=e=>say(e.results[0][0].transcript);r.onerror=()=>toast('Mic unavailable. Type a command.');r.start();toast('Listening…')}
/* pages */
const F=[['ai','🤖','AI Banking Assistant','Chat about your money',1],['voice','🎙️','Voice Banking','Speak your commands',0],['senior','🧓','Senior Citizen Mode','Large, simple screens',1],['security','🔐','Advanced Security','Protect your account',1],['scam','🚨','Scam & Fraud Warning','Spot fake messages',1],['expense','🧾','Smart Expense Tracker','Track your spending',0],['bills','📅','Bill & EMI Manager','Never miss a due date',1],['card','💳','Card Control','Freeze and set limits',1],['atm','📍','Nearby ATM','Find ATMs and branches',0],['docs','🗂️','Digital Documents','Statements and KYC',0],['family','👨‍👩‍👧','Family Banking','Kids and shared goals',0],['access','♿','Accessibility Mode','Text, colour, motion',0],['video','📹','Video Banking','Meet your manager',0],['notif','🔔','Notifications','Alerts you choose',0],['invest','📈','Investment Hub','SIP, funds, FD, gold',0],['health','❤️','Financial Health Score','Your score out of 900',0],['emiburden','⚖️','EMI Burden','Is your EMI safe?',0],['pattern','📊','Spending Pattern','Trends and spikes',0],['divers','🥧','Diversification','Balance your assets',0]];
const P={
ai:()=>({d:'Ask questions about your money. Try the suggestions below.',h:`<div class="card"><div class="chat" id="cl"><div class="b">Hi Aarav! How can I help today?</div></div><div class="chips">${['What is my balance?','Show last transactions','How to save more?'].map(x=>`<button onclick="chat('${x}')">${x}</button>`).join('')}</div><div style="display:flex;gap:8px"><input id="cq" placeholder="Type a question" onkeydown="event.key=='Enter'&&chat()"><button class="btn sm" onclick="chat()">Send</button></div></div>`}),
voice:()=>({d:'Say commands like "show my balance". If your browser has no mic support, type the command.',h:`<div class="card" style="text-align:center"><button class="av" style="width:90px;height:90px;font-size:38px;margin:auto" onclick="mic()" aria-label="Start listening">🎙️</button><p class="mu">Tap the mic and speak</p><div style="display:flex;gap:8px"><input id="vq" placeholder="or type: show my balance" onkeydown="event.key=='Enter'&&say()"><button class="btn sm" onclick="say()">Go</button></div><div class="res" id="vo2" style="text-align:left">Your reply will appear here.</div></div>`}),
senior:()=>({d:'Switch on large text, high contrast and a simpler dashboard. Easier on the eyes and hands.',h:`<div class="card">${`<div class="row"><span><b>Senior Citizen Mode</b><br><small>Large text, high contrast, only key features</small></span><button class="sw ${S.sr?'on':''}" aria-label="Senior mode" onclick="S.sr=!S.sr;document.body.classList.toggle('sr',S.sr);show('senior')"></button></div>`}<button class="btn" onclick="toast('Calling Riya (family)…')">📞 Call my family</button><button class="btn alt" onclick="toast('Calling Meridian helpline 1800-000-123')">☎️ Call bank helpline</button></div>`}),
security:()=>({d:'Review your protection, devices and recent logins.',h:`<div class="grid g2e"><div class="card"><h3>Security checklist</h3>${T('Two-factor login','OTP at every login')}${T('Biometric unlock','Fingerprint or face')}${T('Login alerts','SMS for new devices')}<button class="btn red" onclick="S.lock=!S.lock;toast(S.lock?'Account locked. Call us to unlock.':'Account unlocked');show('security')">${S.lock?'🔓 Unlock my account':'🔒 Lock my account'}</button></div><div class="card"><h3>Trusted devices</h3>${['Pixel 8 · Mumbai','MacBook · Home Wi-Fi'].map(x=>`<div class="row"><span>${x}</span><span class="tag ok">Trusted</span></div>`).join('')}<h3 style="margin-top:14px">Login history</h3>${[['Today 9:12 AM','Mumbai','ok'],['Yesterday 8:40 PM','Mumbai','ok'],['28 Sep 2:05 AM','Unknown city','bd']].map(x=>`<div class="row"><span>${x[0]}<br><small>${x[1]}</small></span><span class="tag ${x[2]}">${x[2]=='ok'?'You':'Blocked'}</span></div>`).join('')}</div></div>`}),
scam:()=>({d:'Meridian will never ask for your PIN, OTP or password. Check anything that looks suspicious.',h:`<div class="grid g2e"><div class="card"><h3>Live alerts</h3>${[['Fake KYC SMS going around','bd'],['Courier fee scam calls reported','wr'],['New phishing site mimicking us','bd']].map(x=>`<div class="row"><span>${x[0]}</span><span class="tag ${x[1]}">${x[1]=='bd'?'High':'Medium'}</span></div>`).join('')}<h3 style="margin-top:14px">Tips</h3><p class="mu">Never share OTP. Banks never ask you to pay to receive money. Check the link before clicking.</p></div><div class="card"><h3>Check a message or link</h3><textarea id="sm" rows="4" style="width:100%;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)" placeholder="Paste a message or link"></textarea><button class="btn" onclick="const t=$('#sm').value.toLowerCase(),w=['otp','urgent','blocked','kyc','lottery','click here','bit.ly','free gift','verify now'].filter(x=>t.includes(x));$('#sr2').innerHTML=!t?'Paste something first.':w.length?'<span class=\\'tag bd\\'>Suspicious</span> Found: '+w.join(', ')+'. Do not click or reply.':'<span class=\\'tag ok\\'>Looks safe</span> Still be careful.'">Check now</button><div class="res" id="sr2">Result will appear here.</div></div></div>`}),
expense:()=>{const t=S.exp.reduce((a,x)=>a+x[1],0),p=t/S.budget*100;return{d:'Add expenses and watch your monthly budget.',h:`<div class="grid g2e"><div class="card"><h3>Spend by category</h3>${bars(S.exp)}</div><div class="card"><h3>Add expense</h3><label for="ec">Category</label><select id="ec">${['Food','Travel','Bills','Shopping','Health'].map(x=>`<option>${x}</option>`).join('')}</select>${inp('ea','Amount (₹)','500')}<button class="btn" onclick="const a=num('ea');if(!a)return toast('Enter an amount');S.exp.find(x=>x[0]==$('#ec').value)[1]+=a;toast('Expense added');show('expense')">Add expense</button><h3 style="margin-top:16px">Budget ${fm(t)} of ${fm(S.budget)}</h3><div class="pb"><i style="width:${Math.min(100,p)}%;background:${p>90?'var(--red)':p>70?'var(--sun)':'var(--jade)'}"></i></div><span class="tag ${p>90?'bd':p>70?'wr':'ok'}">${p>90?'Over budget soon':p>70?'Watch your spending':'On track'}</span></div></div>`}},
bills:()=>({d:'See what is due and pay in one tap.',h:`<div class="grid g2e"><div class="card"><h3>Upcoming bills</h3>${[['Electricity','5 Oct',2310],['Broadband','8 Oct',999],['Credit card','12 Oct',6400]].map(x=>`<div class="row"><span><b>${x[0]}</b><br><small>Due ${x[1]} · ${fm(x[2])}</small></span><button class="btn sm" onclick="this.outerHTML='<span class=\\'tag ok\\'>Paid</span>';S.bal-=${x[2]};toast('Paid ${x[0]}')">Pay now</button></div>`).join('')}</div><div class="card"><h3>EMI schedule</h3>${[['Home loan','₹32,400','1 Nov'],['Car loan','₹11,800','5 Nov']].map(x=>`<div class="row"><span><b>${x[0]}</b><br><small>${x[2]}</small></span><b>${x[1]}</b></div>`).join('')}<h3 style="margin-top:14px">Autopay</h3>${T('Home loan EMI','Auto-debit on 1st')}${T('Electricity','Auto-debit on due date',0)}</div></div>`}),
card:()=>({d:'Control how and where your card works.',h:`<div class="grid g2e"><div><div class="vc ${S.fz?'fz':''}" id="vcd"><div style="display:flex;justify-content:space-between"><b>Meridian Platinum</b><span>VISA</span></div><div class="disp" style="font-size:20px;letter-spacing:2px">4829 •••• •••• 7314</div><div style="display:flex;justify-content:space-between"><span>AARAV MEHTA</span><span>09/29</span></div></div></div><div class="card"><div class="row"><span><b>Freeze card</b></span><button class="sw ${S.fz?'on':''}" aria-label="Freeze card" onclick="S.fz=!S.fz;this.classList.toggle('on');$('#vcd').classList.toggle('fz');toast(S.fz?'Card frozen':'Card active')"></button></div>${T('Online payments','E-commerce use')}${T('International use','Foreign transactions',0)}<label for="lm">Monthly limit: <b id="lv">₹1,50,000</b></label><input type="range" id="lm" min="10000" max="300000" step="10000" value="150000" oninput="$('#lv').textContent=fm(this.value)"><button class="btn alt" onclick="toast('PIN reset link sent')">Reset card PIN</button></div></div>`}),
atm:()=>{const L=[['Meridian ATM · Linking Rd',0.3,'24 hours',[60,50]],['Meridian Branch · Bandra',0.9,'10 AM–4 PM',[190,90]],['Meridian ATM · Station',1.4,'24 hours',[120,130]],['Meridian ATM · Mall',2.1,'10 AM–10 PM',[230,40]]];return{d:'Tap an ATM to see it on the map.',h:`<div class="grid g2e"><div class="card"><svg viewBox="0 0 280 170" width="100%" role="img" aria-label="Map"><rect width="280" height="170" rx="12" fill="var(--jade2)"/><path d="M0 85H280M140 0V170M0 30L280 140" stroke="var(--line)" stroke-width="8" fill="none"/><circle cx="140" cy="85" r="8" fill="var(--sun)"/><text x="150" y="80" font-size="10" fill="var(--ink)">You</text>${L.map((x,i)=>`<circle id="pin${i}" cx="${x[3][0]}" cy="${x[3][1]}" r="8" fill="var(--jade)"/>`).join('')}</svg></div><div class="card">${L.map((x,i)=>`<div class="row" style="cursor:pointer" onclick="document.querySelectorAll('[id^=pin]').forEach(c=>c.setAttribute('r',8));$('#pin${i}').setAttribute('r',14);toast('${x[0]}')"><span><b>${x[0]}</b><br><small>${x[2]}</small></span><b>${x[1]} km</b></div>`).join('')}</div></div>`}},
docs:()=>({d:'Keep your important papers safe and ready.',h:`<div class="card">${['Account statement (Sep 2026)','KYC documents','Tax certificate FY 25-26','Home loan sanction letter'].map(x=>`<div class="row"><span>📄 ${x}</span><span><button class="btn alt sm" onclick="toast('Opening ${x}')">View</button> <button class="btn sm" onclick="toast('Download started (demo)')">Download</button></span></div>`).join('')}<div id="up"></div><input type="file" id="uf" class="hide" onchange="if(this.files[0]){$('#up').insertAdjacentHTML('beforeend','<div class=\\'row\\'><span>📎 '+this.files[0].name+'</span><span class=\\'tag ok\\'>Uploaded</span></div>');toast('Document uploaded')}"><button class="btn" onclick="$('#uf').click()">⬆️ Upload a document</button></div>`}),
family:()=>({d:'Manage family accounts, pocket money and shared goals.',h:`<div class="grid g2e"><div class="card"><h3>Members</h3>${[['Riya (Spouse)',45000],['Aryan (Son, 14)',2000],['Anaya (Daughter, 10)',1000]].map((x,i)=>`<div class="row"><span><b>${x[0]}</b><br><small>Limit <b id="fl${i}">${fm(x[1])}</b>/month</small><input type="range" min="500" max="50000" step="500" value="${x[1]}" aria-label="Limit" oninput="$('#fl${i}').textContent=fm(this.value)"></span></div>`).join('')}</div><div class="card"><h3>Shared goals</h3>${[['Goa trip',65],['New car',30]].map(x=>`<b>${x[0]}</b> <small>${x[1]}%</small><div class="pb"><i style="width:${x[1]}%"></i></div>`).join('')}<h3 style="margin-top:12px">Approval requests</h3>${[['Aryan: ₹1,200 game purchase'],['Anaya: ₹400 book fair']].map(x=>`<div class="row"><span>${x[0]}</span><span><button class="btn sm" onclick="this.closest('.row').remove();toast('Approved')">Yes</button> <button class="btn alt sm" onclick="this.closest('.row').remove();toast('Declined')">No</button></span></div>`).join('')}</div></div>`}),
access:()=>({d:'Make the app comfortable for you.',h:`<div class="card"><label for="fs">Text size: <b id="fv">100%</b></label><input type="range" id="fs" min="85" max="150" value="100" oninput="document.documentElement.style.fontSize=this.value+'%';$('#fv').textContent=this.value+'%'">${[['Dark theme','Easier on the eyes at night','dk'],['Colour-blind friendly','Blue and orange palette','cb'],['Reduce motion','Turn off animations','rm']].map(x=>`<div class="row"><span><b>${x[0]}</b><br><small>${x[1]}</small></span><button class="sw" aria-label="${x[0]}" onclick="this.classList.toggle('on');const o=this.classList.contains('on');${x[2]=='dk'?"document.documentElement.dataset.theme=o?'dark':'light'":x[2]=='cb'?"document.documentElement.classList.toggle('cb',o)":"document.body.classList.toggle('rm',o)"}"></button></div>`).join('')}<small>All controls have screen-reader labels and keyboard focus.</small></div>`}),
video:()=>({d:'Talk face to face with a relationship manager.',h:`<div class="grid g2e"><div class="card"><div class="call" id="cv">📹<br>Not connected</div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn sm" onclick="$('#cv').innerHTML='👩‍💼<br>Connected to Priya (RM)'">Connect</button><button class="btn alt sm" onclick="this.textContent=this.textContent=='Mute'?'Unmute':'Mute';toast(this.textContent=='Mute'?'Mic on':'Mic muted')">Mute</button><button class="btn red sm" onclick="$('#cv').innerHTML='📹<br>Call ended';toast('Call ended')">End</button></div></div><div class="card"><h3>Book a slot</h3><div class="chips">${['10:00 AM','11:30 AM','2:00 PM','4:30 PM'].map(x=>`<button onclick="document.querySelectorAll('.chips button').forEach(b=>b.classList.remove('on'));this.classList.add('on');toast('Booked ${x} tomorrow')">${x}</button>`).join('')}</div></div></div>`}),
notif:()=>({d:'Choose which alerts you want.',h:`<div class="grid g2e"><div class="card"><h3>Alert types</h3>${Object.keys(S.nt).map(k=>`<div class="row"><b>${k}</b><button class="sw ${S.nt[k]?'on':''}" aria-label="${k}" onclick="S.nt['${k}']=!S.nt['${k}'];show('notif')"></button></div>`).join('')}</div><div class="card"><h3>Your feed</h3>${[['Security','New login from Mumbai'],['Payments','₹85,000 salary credited'],['Offers','5% cashback on fuel'],['Tips','You can save ₹1,800 this month'],['Payments','Electricity bill due in 4 days']].filter(x=>S.nt[x[0]]).map(x=>`<div class="row"><span>${x[1]}</span><span class="tag ok">${x[0]}</span></div>`).join('')||'<p class="mu">All alert types are off.</p>'}</div></div>`}),
invest:()=>({d:'Grow your money with a SIP, mutual funds, FD or gold.',h:`<div class="grid g2e"><div class="card"><h3>SIP calculator</h3>${inp('sp','Monthly (₹)',5000)}${inp('sr','Return (% p.a.)',12)}${inp('sy','Years',10)}<div class="res"><small>Future value</small><div class="big" id="so"></div><small id="si"></small></div></div><div class="card"><h3>Options</h3>${[['SIP','12% est.'],['Mutual funds','10–14%'],['Fixed deposit','7.1%'],['Gold bond','6.2%']].map(x=>`<div class="row"><b>${x[0]}</b><span class="cr">${x[1]}</span></div>`).join('')}<h3 style="margin-top:12px">Portfolio</h3>${fm(135500)} invested</div></div>`,i:()=>{const u=()=>{const i=num('sr')/1200,n=num('sy')*12,p=num('sp'),f=i?p*((Math.pow(1+i,n)-1)/i)*(1+i):p*n;$('#so').textContent=fm(f);$('#si').textContent='Invested '+fm(p*n)+' · Returns '+fm(f-p*n)};['sp','sr','sy'].forEach(k=>$('#'+k).oninput=u);u()}}),
health:()=>({d:'A score out of 900 built from your habits.',h:`<div class="grid g2e"><div class="card" style="text-align:center"><svg viewBox="0 0 180 100" width="260" role="img" aria-label="Score 782 of 900"><path d="M10 90A80 80 0 0 1 170 90" fill="none" stroke="var(--line)" stroke-width="16" stroke-linecap="round"/><path d="M10 90A80 80 0 0 1 170 90" fill="none" stroke="var(--jade)" stroke-width="16" stroke-linecap="round" stroke-dasharray="${251.3*782/900} 251.3"/><text x="90" y="85" text-anchor="middle" font-size="30" font-weight="800" fill="var(--ink)">782</text></svg><span class="tag ok">Excellent</span></div><div class="card"><h3>What affects it</h3>${[['Payment history',95],['Savings rate',72],['Credit usage',60],['Debt burden',80]].map(x=>`<small>${x[0]}</small><div class="pb"><i style="width:${x[1]}%"></i></div>`).join('')}<h3>Tips</h3><p class="mu">Keep credit usage under 30% and pay bills before the due date.</p></div></div>`}),
emiburden:()=>({d:'Compare your EMIs with your income.',h:`<div class="card" style="max-width:480px">${inp('ei','Monthly income (₹)',90000)}${inp('em','Total monthly EMIs (₹)',44200)}<div class="res"><div class="big" id="er"></div><span id="et"></span></div></div>`,i:()=>{const u=()=>{const r=num('em')/(num('ei')||1)*100;$('#er').textContent=r.toFixed(1)+'% of income';$('#et').innerHTML=r<30?'<span class="tag ok">Safe</span> Below 30%':r<45?'<span class="tag wr">Caution</span> Between 30–45%':'<span class="tag bd">Risky</span> Above 45%. Consider reducing debt.'};['ei','em'].forEach(k=>$('#'+k).oninput=u);u()}}),
pattern:()=>{const m=[['May',21000],['Jun',24500],['Jul',19800],['Aug',27300],['Sep',31200]],mx=31200;const pts=m.map((x,i)=>`${i*65+20},${110-x[1]/mx*90}`).join(' ');return{d:'See how your spending moves month to month.',h:`<div class="grid g2e"><div class="card"><h3>Monthly trend</h3><svg viewBox="0 0 300 140" width="100%" role="img" aria-label="Line chart"><polyline points="${pts}" fill="none" stroke="var(--jade)" stroke-width="3"/>${m.map((x,i)=>`<circle cx="${i*65+20}" cy="${110-x[1]/mx*90}" r="4" fill="var(--jade)"/><text x="${i*65+20}" y="130" text-anchor="middle" font-size="10" fill="var(--mute)">${x[0]}</text>`).join('')}</svg></div><div class="card"><h3>Top categories</h3>${S.exp.slice().sort((a,b)=>b[1]-a[1]).slice(0,3).map(x=>`<div class="row"><b>${x[0]}</b><span>${fm(x[1])}</span></div>`).join('')}<h3 style="margin-top:12px">Unusual spend</h3><span class="tag wr">Sep +14%</span> <small>Shopping was higher than usual.</small></div></div>`}},
divers:()=>({d:'See how your money is spread across assets.',h:`<div class="grid g2e"><div class="card" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${donut([['Equity',55],['Debt',25],['Gold',10],['Cash',10]])}</div><div class="card"><h3>Suggestion</h3><p>Equity is 55%. Your target is 50%. Move about ₹6,800 into debt funds or gold to rebalance.</p><button class="btn" onclick="toast('Rebalance plan saved (demo)')">Apply suggestion</button></div></div>`})
};
/* router */
function show(id){$('#pm').classList.add('hide');const pg=$('#pg');scrollTo(0,0);
 if(id=='dash'){const f=F.filter(x=>!S.sr||x[4]);pg.innerHTML=`<div class="grid g2"><div class="card bal"><button class="eye" onclick="S.show=!S.show;show('dash')">${S.show?'Hide':'Show'}</button><small>Hello, Aarav 👋 Available balance</small><div class="amt">${S.show?fm(S.bal):'₹ ••••••'}</div><small>Savings ••5678</small><br><button class="btn alt sm" style="margin-top:12px" onclick="$('#ph').click()">Change profile photo</button><input type="file" id="ph" accept="image/*" class="hide" onchange="const r=new FileReader();r.onload=()=>{S.photo=r.result;av();toast('Photo updated')};r.readAsDataURL(this.files[0])"></div><div class="card"><h3>Recent</h3>${tx.map(t=>`<div class="row"><span>${t[0]}</span><span class="${t[1]>0?'cr':'dr'}">${t[1]>0?'+':'−'}${fm(Math.abs(t[1]))}</span></div>`).join('')}</div></div><h3 style="margin:22px 0 12px">Features</h3><div class="grid g3">${f.map(x=>`<button class="tile" onclick="show('${x[0]}')"><span class="ic">${x[1]}</span><b>${x[2]}</b><small>${x[3]}</small></button>`).join('')}</div>`;av();return}
 const f=F.find(x=>x[0]==id),p=P[id]();pg.innerHTML=`<button class="back" onclick="show('dash')">← Back to dashboard</button><div style="display:flex;gap:12px;align-items:center;margin-bottom:6px"><span class="ic">${f[1]}</span><h2 style="font-size:26px">${f[2]}</h2></div><p class="mu" style="margin:0 0 16px">${p.d}</p>${p.h}`;if(p.i)p.i();
}
function av(){const a=$('#avT');a.style.backgroundImage=S.photo?`url(${S.photo})`:'';a.textContent=S.photo?'':'AM'}
av();
</script></body></html>
